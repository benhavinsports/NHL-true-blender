name: Blender end-to-end verification
on:
  push:
    branches: [main]
    paths:
      - 'nhl_true_blender_engine/**'
      - 'run_true_blender.py'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/blender-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install engine and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r nhl_true_blender_engine/requirements.txt pytest
      - name: Compile all engine and runner modules
        run: python -m compileall -q nhl_true_blender_engine run_true_blender.py postgame_grade.py postgame_audit.py
      - name: Validate accessible browser dashboard and JavaScript syntax
        run: |
          node --check site/gate-facts.js
          node --check site/scouting-cards.js
          node --check site/pool-deck.js
          node --check site/app.js
          node --test site/tests/card-flip.test.cjs
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, parse_qs
          class AuditHTML(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=set()
                  self.styles=set()
                  self.scripts=set()
              def handle_starttag(self, tag, attrs):
                  props=dict(attrs)
                  if props.get('id'):
                      assert props['id'] not in self.ids, 'Duplicate dashboard ID: '+props['id']
                      self.ids.add(props['id'])
                  if tag=='link' and props.get('rel')=='stylesheet':
                      self.styles.add(props.get('href'))
                  if tag=='script' and props.get('src'):
                      self.scripts.add(props['src'])
          parser=AuditHTML()
          parser.feed(Path('site/index.html').read_text())
          required={'refresh','slate-select','core-cards',
                    'pool-list','grade-summary','season-summary',
                    'hero-phase','slate-notice'}
          assert required<=parser.ids, sorted(required-parser.ids)
          style_paths={urlsplit(url).path for url in parser.styles}
          script_paths={urlsplit(url).path for url in parser.scripts}
          assert './styles.css' in style_paths
          assert {'./app.js','./gate-facts.js',
                  './scouting-cards.js','./pool-deck.js'}<=script_paths
          # A mixed cached stylesheet and renderer can hide every player
          # nameplate under the photo. Assets must share one cache version.
          static_links=[*parser.styles,*parser.scripts]
          versions={parse_qs(urlsplit(url).query).get('v',[''])[0]
                    for url in static_links}
          assert len(versions)==1 and '' not in versions, versions
          assert not {'system-summary','matchup-list','master-gate-deck'} & parser.ids
          assert Path('site/app.js').is_file() and Path('site/styles.css').is_file()
          print('Frontend passed syntax, unique IDs, evidence drilldown and asset linkage')
          PY
      - name: Inspect recorded pre-Core survivor evidence (read-only)
        run: |
          python - <<'PY'
          import gzip, json, os, shutil, sqlite3, tempfile
          from pathlib import Path
          source=Path('state/true_blender.sqlite.gz')
          if not source.exists():
              print('Saved database not available for diagnostic')
          else:
              with tempfile.TemporaryDirectory() as tmp:
                  database=Path(tmp)/'blender.sqlite'
                  with gzip.open(source,'rb') as inp,open(database,'wb') as out:
                      shutil.copyfileobj(inp,out)
                  con=sqlite3.connect(str(database))
                  con.row_factory=sqlite3.Row
                  for pid,name in [('8477933','Reinhart'),('8482116','Stutzle'),
                                   ('8474716','Spurgeon'),('8484227','Smith')]:
                      rows=con.execute("""
                        SELECT stage,gate,disposition,details,evaluated_at
                        FROM gates
                        WHERE slate_date='2026-11-17' AND player_id=?
                          AND gate IN ('G4','G7','G10','G11','G15','G17','G18')
                        ORDER BY stage,gate
                      """,(pid,)).fetchall()
                      for row in rows:
                          details=json.loads(row['details'])
                          ev=details.get('evidence') or {}
                          rec=ev.get('eventLogReconciled') or {}
                          pressure=ev.get('recentOwnAttempts')
                          print('ORIGINAL_SURVIVOR_EVIDENCE',
                                json.dumps({'player':name,'stage':row['stage'],
                                  'gate':row['gate'],'disposition':row['disposition'],
                                  'appearanceDates':rec.get('appearanceDates'),
                                  'distinctGoalDates':rec.get('distinctGoalDates'),
                                  'sampleGoals':rec.get('officialGoals'),
                                  'recentOwnAttempts':pressure,
                                  'routeOwnedGoals':(ev.get('ownRelease') or {}).get('ownedGoals'),
                                  'G17Unresolved':(ev.get('counterevidence') or {}).get('unresolved'),
                                  'firstElimination':ev.get('alreadyEliminatedAtGate'),
                                  'evaluatedAt':row['evaluated_at']},sort_keys=True))
                  con.close()
          PY
      - name: G0-first G1-G18 and overlay integration regression
        run: python -m pytest -q nhl_true_blender_engine/tests --junitxml=integration-results.xml
      - name: Verify complete synthetic card and postgame grading
        run: python -m pytest -q nhl_true_blender_engine/tests/test_end_to_end_contract.py
      - name: Publish verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-verification-${{ github.sha }}
          path: integration-results.xml
          if-no-files-found: warn
