name: Verify unified NHL True Blender gates
on:
  pull_request:
  push:
    branches:
      - repair/unified-g0-g18-20261117
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r nhl_true_blender_engine/requirements.txt pytest
      - name: Verify source compiles
        run: python -m compileall -q run_true_blender.py nhl_true_blender_engine scripts
      - name: Run repository-wide unittest suite used in production
        run: python -m unittest discover -p 'test*.py' -v
      - name: Run existing engine regression suite
        run: python -m pytest -q nhl_true_blender_engine/tests
      - name: Verify dashboard JavaScript parses
        run: node --check site/app.js
