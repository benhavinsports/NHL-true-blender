name: Historical replay pytest
on:
  push:
    branches: [audit/historical-season-replay]
permissions:
  contents: read
jobs:
  engine-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r nhl_true_blender_engine/requirements.txt pytest
      - name: Run engine regression suite
        run: python -m pytest -q --import-mode=importlib nhl_true_blender_engine/tests scripts/tests
