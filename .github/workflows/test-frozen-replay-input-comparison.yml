name: Verify exact-frozen-input historical comparator
on:
  push:
    branches: [repair/historical-frozen-input-comparison-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Validate source and frozen-input regression
        run: |
          python -m compileall -q scripts/compare_historical_replays.py
          python -m pytest -q scripts/tests/test_compare_historical_replays.py
