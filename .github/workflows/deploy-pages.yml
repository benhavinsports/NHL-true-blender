name: Deploy NHL True Blender site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'index.html'
      - 'runs/**'
      - 'state/site_cards/**'
      - 'state/site_runs/**'
      - 'state/history/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read # deploy-pages v4 must read the uploaded github-pages artifact
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified run data
        shell: bash
        run: |
          mkdir -p site/data
          python - <<'PY'
          import json, pathlib, datetime
          root=pathlib.Path('state')
          status_files=sorted((root/'site_runs').glob('????-??-??.json'))
          card_files=sorted((root/'site_cards').glob('????-??-??.json'))
          dates=sorted({p.stem for p in status_files+card_files})
          # Retain all previous official season history in the repository.
          # GitHub Pages displays the newest cumulative frozen-grade report;
          # no ungraded game or synthetic calibration example is published.
          history_files=sorted((root/'history').glob('????-??.json'))
          if history_files:
              history=json.loads(history_files[-1].read_text(encoding='utf-8'))
              if history.get('source')!='FROZEN_SQLITE_CARDS_PLUS_OFFICIAL_NHL_GOAL_GRADES':
                  raise ValueError('Refusing unverifiable season history')
              if history.get('officiallyGradedSlates')!=len(history.get('allOfficialGrades',[])):
                  raise ValueError('Season summary and official ledger are inconsistent')
          else:
              history={'status':'AWAITING_OFFICIAL_GRADED_SLATES',
                       'officiallyGradedSlates':0,'wins':0,'losses':0,
                       'legHits':0,'legOpportunities':0,
                       'monthlyThreeSlateCalibration':{},
                       'verifiedAutomaticGuardPatches':[],
                       'allOfficialGrades':[],'noSelectionsOrRetroactiveGradesInvented':True}
          pathlib.Path('site/data/season-history.json').write_text(
              json.dumps(history,default=str))
          if dates:
              date=dates[-1]
              status_path=root/'site_runs'/f'{date}.json'
              card_path=root/'site_cards'/f'{date}.json'
              status=json.loads(status_path.read_text()) if status_path.exists() else {}
              card=json.loads(card_path.read_text()) if card_path.exists() else None
              # A postgame official grade updates the SAME locked Core,
              # never creates a replacement selection. Keep both states
              # publishable while rejecting fabricated grade assertions.
              if card and not (card.get('verified') is True and
                  card.get('status') in ('G18_SOURCE_VERIFIED','FROZEN_GRADED')):
                  raise ValueError('Refusing unverified Core card')
              legs=json.loads(card['legsJson']) if card else []
              grade_report=None
              if card and card.get('gradeJson'):
                  grade_report=json.loads(card['gradeJson'])
                  if grade_report:
                      count=grade_report.get('legs')
                      hits=grade_report.get('hits')
                      result=grade_report.get('result')
                      sources=grade_report.get('officialSources') or []
                      if (count!=len(legs) or type(hits) is not int
                          or not 0<=hits<=count or
                          result!=('WIN' if hits==count else 'LOSS')
                          or not sources or not all(
                            isinstance(u,str) and u.startswith('https://')
                            for u in sources)):
                          raise ValueError('Invalid frozen Core official grade evidence')
              if card and card.get('status')=='FROZEN_GRADED' and not grade_report:
                  raise ValueError('Frozen graded card missing official evidence')
              # The immutable published card stores the original labels.
              # A newer G18 source audit may establish a different path for
              # the SAME selected player without authorizing a replacement.
              # Publish that evidence as a separate view, NEVER modify legs,
              # fingerprint, cardId, revision or the frozen original label.
              audited=[]
              if card and status.get('slateDate')==date:
                  by_recipient={
                      (str(row.get('gameId')),str(row.get('playerId'))):row
                      for row in status.get('allG18QualifiedSurvivors',[])
                      if isinstance(row,dict)
                  }
                  for leg in legs:
                      record=by_recipient.get((
                          str(leg.get('gameId')),str(leg.get('playerId'))))
                      if not record:
                          continue
                      proof=record.get('pathClassificationEvidence') or {}
                      path=record.get('routeLabel')
                      if (path not in ('PRIMARY','TRANSFER','WHO')
                          or proof.get('path')!=path
                          or proof.get('selectionIndependentOfLabel') is not True
                          or proof.get('pathQuotaApplied') is not False
                          or (proof.get('positiveDirectGateEvidence') or {}).get(
                              'G0ThruG17SourcePass') is not True
                          or not proof.get('sourceUrls')):
                          continue
                      # The pregame watch freezes each leg at puck drop.
                      # Do not revise a label using a post-puck source run.
                      started=leg.get('startUTC')
                      observed=status.get('updatedUTC')
                      if started and observed:
                          if (datetime.datetime.fromisoformat(
                                  observed.replace('Z','+00:00')) >=
                              datetime.datetime.fromisoformat(
                                  started.replace('Z','+00:00'))):
                              continue
                      audited.append({
                          'gameId':str(leg['gameId']),
                          'playerId':str(leg['playerId']),
                          'player':leg['player'],
                          'originalLockedPath':leg['path'],
                          'auditedPath':path,
                          'rationale':proof.get('rationale'),
                          'originalScoringLane':proof.get('originalScoringLane'),
                          'scoringLane':proof.get('scoringLane'),
                          'sourceUrls':proof['sourceUrls'],
                          'reviewedAtUTC':observed,
                          'sameLockedRecipient':True,
                          'doesNotReplaceCard':True,
                      })
              payload={
                  'date':date,'stage':card.get('stage') if card else status.get('stage'),
                  'publishedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'lastEngineRunUTC':status.get('updatedUTC'),
                  'games':status.get('games'),'g0Directions':status.get('g0Directions'),
                  'gateRows':status.get('gateRows'),
                  'eligibleSkaterRows':status.get('eligibleSkaterRows'),
                  'missingByGate':status.get('missingByGate',{}),
                  'gateCertification':status.get('gateCertification',{}),
                  'selectionFunnel':status.get('selectionFunnel',{}),
                  'survivorOnlyCertification':status.get('survivorOnlyCertification'),
                  'nonselectedGateAuditIsDiagnosticOnly':True,
                  'historicalShiftCoverage':status.get('historicalShiftCoverage',{}),
                  'currentRunFullyCertified':status.get('currentRunFullyCertified'),
                  'publicationDecision':status.get('publicationDecision'),
                  'retainedOriginalLockedCard':status.get('retainedOriginalLockedCard',False),
                  'independentOverlaySourceGaps':status.get('independentOverlaySourceGaps',[]),
                  'errors':status.get('errors',[]),
                  'nonselectedGameResearchNotes':status.get('nonselectedGameResearchNotes',[]),
                  'card':{'cardId':card['cardId'],'current_legs':legs,
                          'revision':card.get('revision'),'fingerprint':card.get('fingerprint')}
                          if card else None,
                  'verified':bool(card),
                  'postgameGrade':grade_report,
                  'postgameGradeStatus':('OFFICIALLY_GRADED' if grade_report
                     else 'AWAITING_ALL_GAMES_FINAL' if card else 'NO_LOCKED_CARD'),
                  'pathAudit':audited,
                  'pathAuditIsSeparateFromOriginalFrozenCard':True,
              }
              pathlib.Path('site/data/latest.json').write_text(json.dumps(payload,default=str))
          else:
              pathlib.Path('site/data/latest.json').write_text(json.dumps({
                  'date':None,'stage':None,'card':None,'verified':False,
                  'status':'AWAITING_FIRST_ENGINE_RUN',
                  'publishedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
              }))

          PY
      - name: Verify dashboard is deployment entry point
        run: |
          test -s site/index.html
          grep -q '<title>NHL True Blender</title>' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
