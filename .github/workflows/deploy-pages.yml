name: Publish static unrestricted dashboard
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'unrestricted/cards/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: unrestricted-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy saved unrestricted card only (no selection)
        run: |
          mkdir -p site/data
          if [ -d unrestricted/cards ]; then
            latest=$(find unrestricted/cards -maxdepth 1 -name '????-??-??.json' | sort | tail -1)
            if [ -n "$latest" ]; then cp "$latest" site/data/unrestricted-core.json; fi
          fi
          node --check site/app.js
          rm -f site/data/season-history.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
