name: Deploy NHL True Blender site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'index.html'
      - 'runs/**'
      - 'state/site_cards/**'
      - 'state/site_runs/**'
      - 'state/site_gates/**'
      - 'state/history/**'
      - 'state/true_blender.sqlite.gz'
      - 'nhl_true_blender_engine/dashboard_export.py'
      - 'scripts/refresh_selected_gate_exports.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read # deploy-pages v4 must read the uploaded github-pages artifact
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild read-only Core evidence from saved source receipts
        run: |
          python scripts/ledger_persistence.py restore
          python -m scripts.refresh_selected_gate_exports
      - name: Prepare verified run data
        shell: bash
        run: |
          mkdir -p site/data
          python - <<'PY'
          import json, pathlib, datetime
          root=pathlib.Path('state')
          from scripts.preserved_core_receipt import verified_original_receipt
          status_files=sorted((root/'site_runs').glob('????-??-??.json'))
          card_files=sorted((root/'site_cards').glob('????-??-??.json'))
          dates=sorted({p.stem for p in status_files+card_files})
          # Browse every preserved authoritative card without calling ChatGPT.
          # Evidence drilldowns are exported ONLY from saved selected-player
          # pre-puck gate receipts; a mismatch never falls back to invented PASS.
          archive=[]
          slate_dir=pathlib.Path('site/data/slates')
          slate_dir.mkdir(parents=True,exist_ok=True)
          def same_upstream_core(date, legs):
              # G18 only assembles actual survivors: never display three of
              # four source-qualified players as a verified card.
              run_path=root/'site_runs'/f'{date}.json'
              if not run_path.exists():
                  return True
              run=json.loads(run_path.read_text(encoding='utf-8'))
              survivors=run.get('preCoreQualifiedSurvivors')
              if not isinstance(survivors,list) or not survivors:
                  return True  # Grade-only or older receipts are not reparsed.
              # Survivors G16's saved cross-game finalist competition retained.
              from nhl_true_blender_engine.core_identity import expected_core_ids
              before=expected_core_ids(run)
              if before is None:
                  return False
              after=[(str(x.get('gameId')),str(x.get('playerId')))
                     for x in legs]
              return (len(before)==len(after) and
                      len(set(before))==len(before) and set(before)==set(after))
          def saved_original_proof(date,card):
              return verified_original_receipt(root,date,card) if card else None

          for saved_path in card_files:
              saved=json.loads(saved_path.read_text(encoding='utf-8'))
              if not (saved.get('verified') is True and saved.get('status')
                      in ('G18_SOURCE_VERIFIED','FROZEN_GRADED')):
                  continue
              saved_legs=json.loads(saved.get('legsJson','[]'))
              if not isinstance(saved_legs,list) or not saved_legs:
                  continue
              saved_date=saved_path.stem
              current_match=same_upstream_core(saved_date,saved_legs)
              original_proof=saved_original_proof(saved_date,saved)
              # A later incomplete projected/confirmed research pass must not
              # REMOVE an independently certified earlier, still-locked card.
              # The archived gate receipts must independently prove EVERY
              # original gate before the old selection is visible.
              if not current_match and original_proof is None:
                  print('::warning::Saved Core has no independent source proof for '+saved_date)
                  continue
              if not current_match:
                  print('::warning::Current research incomplete; retaining only source-verified prior G18 receipt for '+saved_date)
              grade=json.loads(saved.get('gradeJson') or '{}')
              entry={
                  'date':saved_date,'cardId':saved.get('cardId'),
                  'fingerprint':saved.get('fingerprint'),
                  'revision':saved.get('revision'),
                  'stage':saved.get('stage'),
                  'cardStatus':saved.get('status'),
                  'current_legs':saved_legs,
                  'grade':grade or None,
                  'verified':True,
                  'savedOriginalEvidenceVerified':bool(original_proof),
                  'currentRunSourceMatch':current_match,
              }
              raw_gates=root/'site_gates'/f'{saved_date}.json'
              if raw_gates.exists():
                  matrix=json.loads(raw_gates.read_text(encoding='utf-8'))
                  saved_keys={(str(l.get('gameId')),str(l.get('playerId')))
                              for l in saved_legs}
                  matrix_keys={(str(l.get('gameId')),str(l.get('playerId')))
                               for l in matrix.get('legs',[])}
                  if (matrix.get('cardId')==entry['cardId'] and
                      matrix.get('fingerprint')==entry['fingerprint'] and
                      saved_keys==matrix_keys):
                      (slate_dir/f'{saved_date}.json').write_text(json.dumps(
                          matrix,default=str))
                      entry['hasGateEvidence']=True
                  else:
                      entry['hasGateEvidence']=False
                      entry['gateEvidenceError']='Card ID, fingerprint or selected recipients do not match saved evidence'
              else:
                  entry['hasGateEvidence']=False
              archive.append(entry)
          archive.sort(key=lambda row:row['date'],reverse=True)
          pathlib.Path('site/data/cards-archive.json').write_text(
              json.dumps({'cards':archive,'singleAuthoritativeCardPerSlate':True},
                         default=str))

          # Retain all previous official season history in the repository.
          # GitHub Pages displays the newest cumulative frozen-grade report;
          # no ungraded game or synthetic calibration example is published.
          history_files=sorted((root/'history').glob('????-??.json'))
          if history_files:
              history=json.loads(history_files[-1].read_text(encoding='utf-8'))
              if history.get('source')!='FROZEN_SQLITE_CARDS_PLUS_OFFICIAL_NHL_GOAL_GRADES':
                  raise ValueError('Refusing unverifiable season history')
              if history.get('officiallyGradedSlates')!=len(history.get('allOfficialGrades',[])):
                  raise ValueError('Season summary and official ledger are inconsistent')
          else:
              history={'status':'AWAITING_OFFICIAL_GRADED_SLATES',
                       'officiallyGradedSlates':0,'wins':0,'losses':0,
                       'legHits':0,'legOpportunities':0,
                       'monthlyThreeSlateCalibration':{},
                       'verifiedAutomaticGuardPatches':[],
                       'allOfficialGrades':[],'noSelectionsOrRetroactiveGradesInvented':True}
          pathlib.Path('site/data/season-history.json').write_text(
              json.dumps(history,default=str))
          if dates:
              date=dates[-1]
              status_path=root/'site_runs'/f'{date}.json'
              card_path=root/'site_cards'/f'{date}.json'
              status=json.loads(status_path.read_text()) if status_path.exists() else {}
              card=json.loads(card_path.read_text()) if card_path.exists() else None
              # A postgame official grade updates the SAME locked Core,
              # never creates a replacement selection. Keep both states
              # publishable while rejecting fabricated grade assertions.
              if card and not (card.get('verified') is True and
                  card.get('status') in ('G18_SOURCE_VERIFIED','FROZEN_GRADED')):
                  manifest_path=root/'core_retractions'/f'{date}.json'
                  if (card.get('verified') is False and
                      card.get('status')=='RETRACTED_UNAUTHORIZED_G18' and
                      manifest_path.is_file()):
                      original=json.loads(manifest_path.read_text(encoding='utf-8'))
                      if (original.get('originalFingerprint')!=card.get('fingerprint')
                          or original.get('cardId')!=card.get('cardId')):
                          raise ValueError('Retraction identity does not match immutable evidence')
                      # The bad card is visible only in the audit artifact,
                      # never rendered as the current Core or fake verified pick.
                      card=None
                  else:
                      raise ValueError('Refusing unverified Core card')
              legs=json.loads(card['legsJson']) if card else []
              saved_proof=saved_original_proof(date,card)
              current_match=same_upstream_core(date,legs) if card else False
              if card and not current_match:
                  if saved_proof is None:
                      print('::warning::Latest Core conflicts with source run AND has no independent saved pre-puck receipt for '+date)
                      card=None
                      legs=[]
                  else:
                      print('::warning::Latest runner is unresolved; independently verified prior G18 card is preserved, not recertified by this run: '+date)
              grade_report=None
              if card and card.get('gradeJson'):
                  grade_report=json.loads(card['gradeJson'])
                  if grade_report:
                      count=grade_report.get('legs')
                      hits=grade_report.get('hits')
                      result=grade_report.get('result')
                      sources=grade_report.get('officialSources') or []
                      if (count!=len(legs) or type(hits) is not int
                          or not 0<=hits<=count or
                          result!=('WIN' if hits==count else 'LOSS')
                          or not sources or not all(
                            isinstance(u,str) and u.startswith('https://')
                            for u in sources)):
                          raise ValueError('Invalid frozen Core official grade evidence')
              if card and card.get('status')=='FROZEN_GRADED' and not grade_report:
                  raise ValueError('Frozen graded card missing official evidence')
              # The immutable published card stores the original labels.
              # A newer G18 source audit may establish a different path for
              # the SAME selected player without authorizing a replacement.
              # Publish that evidence as a separate view, NEVER modify legs,
              # fingerprint, cardId, revision or the frozen original label.
              audited=[]
              if card and status.get('slateDate')==date:
                  by_recipient={
                      (str(row.get('gameId')),str(row.get('playerId'))):row
                      for row in status.get('preCoreQualifiedSurvivors',[])
                      if isinstance(row,dict)
                  }
                  for leg in legs:
                      record=by_recipient.get((
                          str(leg.get('gameId')),str(leg.get('playerId'))))
                      if not record:
                          continue
                      proof=record.get('pathClassificationEvidence') or {}
                      path=record.get('routeLabel')
                      if (path not in ('PRIMARY','TRANSFER','WHO')
                          or proof.get('path')!=path
                          or proof.get('selectionIndependentOfLabel') is not True
                          or proof.get('pathQuotaApplied') is not False
                          or (proof.get('positiveDirectGateEvidence') or {}).get(
                              'G0ThruG17SourcePass') is not True
                          or not proof.get('sourceUrls')):
                          continue
                      # The pregame watch freezes each leg at puck drop.
                      # Do not revise a label using a post-puck source run.
                      started=leg.get('startUTC')
                      observed=status.get('updatedUTC')
                      if started and observed:
                          if (datetime.datetime.fromisoformat(
                                  observed.replace('Z','+00:00')) >=
                              datetime.datetime.fromisoformat(
                                  started.replace('Z','+00:00'))):
                              continue
                      audited.append({
                          'gameId':str(leg['gameId']),
                          'playerId':str(leg['playerId']),
                          'player':leg['player'],
                          'originalLockedPath':leg['path'],
                          'auditedPath':path,
                          'rationale':proof.get('rationale'),
                          'originalScoringLane':proof.get('originalScoringLane'),
                          'scoringLane':proof.get('scoringLane'),
                          'sourceUrls':proof['sourceUrls'],
                          'reviewedAtUTC':observed,
                          'sameLockedRecipient':True,
                          'doesNotReplaceCard':True,
                      })
              payload={
                  'date':date,'stage':card.get('stage') if card else status.get('stage'),
                  'publishedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'lastEngineRunUTC':status.get('updatedUTC'),
                  'games':status.get('games'),'g0Directions':status.get('g0Directions'),
                  'gateRows':status.get('gateRows'),
                  'eligibleSkaterRows':status.get('eligibleSkaterRows'),
                  'g0Complete':status.get('g0Complete',0),
                  'g0TwoGoalieDirectionDecisions':status.get('g0TwoGoalieDirectionDecisions',{}),
                  'g0OfficialPbpFallback':status.get('g0OfficialPbpFallback',{}),
                  'bothGoaliesRequiredBeforeG0PlayerElimination':status.get('bothGoaliesRequiredBeforeG0PlayerElimination',False),
                  'missingByGate':status.get('missingByGate',{}),
                  'gateCertification':status.get('gateCertification',{}),
                  'selectionFunnel':status.get('selectionFunnel',{}),
                  'g16FinalistCompetition':status.get('g16FinalistCompetition'),
                  'gameSurvivorPool':status.get('gameSurvivorPool',[]),
                  'survivorOnlyCertification':status.get('survivorOnlyCertification'),
                  'nonselectedGateAuditIsDiagnosticOnly':True,
                  'historicalShiftCoverage':status.get('historicalShiftCoverage',{}),
                  'currentRunFullyCertified':status.get('currentRunFullyCertified'),
                  'publicationDecision':status.get('publicationDecision'),
                  'oldCoreRetractedByRuleCorrection':(
                      (root/'core_retractions'/f'{date}.json').is_file()
                      and (root/'site_cards'/f'{date}.json').is_file()
                      and not bool(card and card.get('verified') is True)),
                  'retainedOriginalLockedCard':bool(card and saved_proof) or status.get('retainedOriginalLockedCard',False),
                  'savedOriginalGateEvidenceVerified':bool(card and saved_proof),
                  'currentReviewMatchesSavedCore':bool(card and current_match),
                  'independentOverlaySourceGaps':status.get('independentOverlaySourceGaps',[]),
                  'errors':status.get('errors',[]),
                  'nonselectedGameResearchNotes':status.get('nonselectedGameResearchNotes',[]),
                  'card':{'cardId':card['cardId'],'current_legs':legs,
                          'revision':card.get('revision'),'fingerprint':card.get('fingerprint')}
                          if card else None,
                  'verified':bool(card),
                  'postgameGrade':grade_report,
                  'postgameGradeStatus':('OFFICIALLY_GRADED' if grade_report
                     else 'AWAITING_ALL_GAMES_FINAL' if card else 'NO_LOCKED_CARD'),
                  'pathAudit':audited,
                  'pathAuditIsSeparateFromOriginalFrozenCard':True,
              }
              pathlib.Path('site/data/latest.json').write_text(json.dumps(payload,default=str))
          else:
              pathlib.Path('site/data/latest.json').write_text(json.dumps({
                  'date':None,'stage':None,'card':None,'verified':False,
                  'status':'AWAITING_FIRST_ENGINE_RUN',
                  'publishedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
              }))

          PY
      - name: Verify dashboard is deployment entry point
        run: |
          test -s site/index.html
          grep -q '<title>NHL True Blender' site/index.html
          grep -q 'id="core-cards"' site/index.html
          grep -q 'id="leg-detail"' site/index.html
          grep -q 'id="slate-select"' site/index.html
          test -s site/styles.css
          test -s site/app.js
          node --check site/gate-facts.js
          node --check site/app.js
          node --test site/tests/card-flip.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub's artifact listing can lag immediately after a successful upload.
      # Keep the one Pages artifact; do not create duplicate deployments.
      - name: Allow Pages artifact metadata to become readable
        run: sleep 12
      - id: deployment
        uses: actions/deploy-pages@v4
