name: Deploy NHL True Blender site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'index.html'
      - 'runs/**'
      - 'state/site_cards/**'
      - 'state/site_runs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified run data
        shell: bash
        run: |
          mkdir -p site/data
          python - <<'PY'
          import json, pathlib, datetime
          root=pathlib.Path('state')
          status_files=sorted((root/'site_runs').glob('????-??-??.json'))
          card_files=sorted((root/'site_cards').glob('????-??-??.json'))
          dates=sorted({p.stem for p in status_files+card_files})
          if dates:
              date=dates[-1]
              status_path=root/'site_runs'/f'{date}.json'
              card_path=root/'site_cards'/f'{date}.json'
              status=json.loads(status_path.read_text()) if status_path.exists() else {}
              card=json.loads(card_path.read_text()) if card_path.exists() else None
              if card and not (card.get('verified') is True and card.get('status')=='G18_SOURCE_VERIFIED'):
                  raise ValueError('Refusing unverified Core card')
              legs=json.loads(card['legsJson']) if card else []
              # The immutable published card stores the original labels.
              # A newer G18 source audit may establish a different path for
              # the SAME selected player without authorizing a replacement.
              # Publish that evidence as a separate view, NEVER modify legs,
              # fingerprint, cardId, revision or the frozen original label.
              audited=[]
              if card and status.get('slateDate')==date:
                  by_recipient={
                      (str(row.get('gameId')),str(row.get('playerId'))):row
                      for row in status.get('allG18QualifiedSurvivors',[])
                      if isinstance(row,dict)
                  }
                  for leg in legs:
                      record=by_recipient.get((
                          str(leg.get('gameId')),str(leg.get('playerId'))))
                      if not record:
                          continue
                      proof=record.get('pathClassificationEvidence') or {}
                      path=record.get('routeLabel')
                      if (path not in ('PRIMARY','TRANSFER','WHO')
                          or proof.get('path')!=path
                          or proof.get('selectionIndependentOfLabel') is not True
                          or proof.get('pathQuotaApplied') is not False
                          or (proof.get('positiveDirectGateEvidence') or {}).get(
                              'G0ThruG17SourcePass') is not True
                          or not proof.get('sourceUrls')):
                          continue
                      # The pregame watch freezes each leg at puck drop.
                      # Do not revise a label using a post-puck source run.
                      started=leg.get('startUTC')
                      observed=status.get('updatedUTC')
                      if started and observed:
                          if (datetime.datetime.fromisoformat(
                                  observed.replace('Z','+00:00')) >=
                              datetime.datetime.fromisoformat(
                                  started.replace('Z','+00:00'))):
                              continue
                      audited.append({
                          'gameId':str(leg['gameId']),
                          'playerId':str(leg['playerId']),
                          'player':leg['player'],
                          'originalLockedPath':leg['path'],
                          'auditedPath':path,
                          'rationale':proof.get('rationale'),
                          'originalScoringLane':proof.get('originalScoringLane'),
                          'scoringLane':proof.get('scoringLane'),
                          'sourceUrls':proof['sourceUrls'],
                          'reviewedAtUTC':observed,
                          'sameLockedRecipient':True,
                          'doesNotReplaceCard':True,
                      })
              payload={
                  'date':date,'stage':card.get('stage') if card else status.get('stage'),
                  'publishedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'lastEngineRunUTC':status.get('updatedUTC'),
                  'games':status.get('games'),'g0Directions':status.get('g0Directions'),
                  'gateRows':status.get('gateRows'),
                  'eligibleSkaterRows':status.get('eligibleSkaterRows'),
                  'missingByGate':status.get('missingByGate',{}),
                  'errors':status.get('errors',[]),
                  'card':{'cardId':card['cardId'],'current_legs':legs,
                          'revision':card.get('revision'),'fingerprint':card.get('fingerprint')}
                          if card else None,
                  'verified':bool(card),
                  'pathAudit':audited,
                  'pathAuditIsSeparateFromOriginalFrozenCard':True,
              }
              pathlib.Path('site/data/latest.json').write_text(json.dumps(payload,default=str))
          else:
              pathlib.Path('site/data/latest.json').write_text(json.dumps({
                  'date':None,'stage':None,'card':None,'verified':False,
                  'status':'AWAITING_FIRST_ENGINE_RUN',
                  'publishedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
              }))

          PY
      - name: Verify dashboard is deployment entry point
        run: |
          test -s site/index.html
          grep -q '<title>NHL True Blender</title>' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
