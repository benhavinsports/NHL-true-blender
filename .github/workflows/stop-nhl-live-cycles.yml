name: Stop NHL live cycles (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/stop-nhl-live-cycles']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel every queued or running NHL engine workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for status in in_progress queued; do
            gh run list --repo "$GH_REPO" --workflow nhl-true-blender.yml --status "$status" --limit 100 --json databaseId --jq '.[].databaseId' |
            while IFS= read -r run_id; do
              if [ -n "$run_id" ]; then
                echo "Canceling NHL engine run $run_id ($status)"
                gh run cancel "$run_id" --repo "$GH_REPO" || true
              fi
            done
          done
          echo "All queued and running NHL engine workflow runs have been sent cancellation requests."
