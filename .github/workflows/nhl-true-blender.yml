name: NHL True Blender - independent scheduled engine
# Engine dispatch: run the full evidence pipeline after the Pages feed connection.
on:
  push:
    branches: [main]
    paths:
      - 'run_true_blender.py'
      - 'nhl_true_blender_engine/**'
      - 'scripts/**'
      - '.github/workflows/nhl-true-blender.yml'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional slate YYYY-MM-DD; blank uses current Eastern date'
        required: false
        type: string
      mode:
        description: 'Engine phase'
        type: choice
        required: false
        options: [projected, confirmed, watch, grade]
  schedule:
    - cron: '15 8 * * *'
      timezone: 'America/New_York'
    - cron: '15 11,13,15,18 * * *'
      timezone: 'America/New_York'
    - cron: '38 7-23 * * *'
      timezone: 'America/New_York'
    - cron: '30 0-6,21-23 * * *'
      timezone: 'America/New_York'
permissions:
  contents: write
  actions: write # workflow_dispatch for the existing GitHub Pages site
concurrency:
  group: nhl-true-blender-authoritative
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original engine and integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r nhl_true_blender_engine/requirements.txt pytest
      - name: Download current MoneyPuck season aggregates
        continue-on-error: true
        run: python scripts/download_moneypuck.py
      - name: Complete legacy and integrated G0-G18 verification
        id: verification
        continue-on-error: true
        run: |
          python -m compileall -q run_true_blender.py nhl_true_blender_engine scripts
          python -m unittest discover -p 'test*.py' -v
          python -m pytest -q nhl_true_blender_engine/tests
      - name: Probe live source schemas without claiming passes
        continue-on-error: true
        run: python -m scripts.diagnose_live_pipeline
      - name: Run scheduled autonomous Blender phase
        id: engine
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          REQUESTED_MODE: ${{ inputs.mode }}
          TRIGGER_CRON: ${{ github.event.schedule }}
          TRIGGER_EVENT: ${{ github.event_name }}
          MONEYPUCK_CSV_DIR: data/moneypuck
        run: |
          python - <<'PY'
          import datetime
          import os
          import subprocess
          from zoneinfo import ZoneInfo

          now = datetime.datetime.now(ZoneInfo('America/New_York'))
          cron = os.environ.get('TRIGGER_CRON') or ''
          mode = os.environ.get('REQUESTED_MODE') or ''
          if not mode:
              if cron.startswith('15 8 '):
                  mode = 'projected'
              elif cron.startswith('15 11,13,15,18 '):
                  mode = 'confirmed'
              elif cron.startswith('38 '):
                  mode = 'watch'
              elif cron.startswith('30 '):
                  mode = 'grade'
              else:
                  mode = 'projected' if now.hour < 11 else ('confirmed' if now.hour < 19 else 'watch')
          date = os.environ.get('REQUESTED_DATE') or (
              (now - datetime.timedelta(days=1)).date().isoformat()
              if mode == 'grade' and now.hour < 8 else now.date().isoformat()
          )
          datetime.date.fromisoformat(date)
          # Carry exact execution phase/date into state-race reconciliation.
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'BLENDER_EXECUTED_DATE={date}\n')
              env.write(f'BLENDER_EXECUTED_MODE={mode}\n')
          print(f'BLENDER AUTONOMOUS {date} {mode} America/New_York')
          if mode in ('projected','confirmed'):
              # Aggregates were freshly downloaded by THIS job, not reused from a past slate.
              if os.environ.get('MONEYPUCK_CSV_DIR'):
                  os.environ['MONEYPUCK_EXPORT_ASOF'] = date
              args = ['python','run_true_blender.py','--date',date,'--mode',mode]
          else:
              args = ['python','-m','scripts.run_cycle','--date',date,'--mode',mode]
          subprocess.run(args,check=True)
          PY
      - name: Persist original canonical G18 state and published site JSON
        id: persist
        if: always() && steps.engine.outcome == 'success'
        env:
          MONEYPUCK_CSV_DIR: data/moneypuck
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- state/)" ]; then
            echo "No new state, grade, or verified card JSON"
            exit 0
          fi
          git config user.name "nhl-blender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/
          git diff --cached --quiet && exit 0
          git commit -m "Save audited authoritative NHL Blender run output"
          # A newer authoritative state can arrive while this run fetches NHL
          # sources. Instead of silently losing the receipt, rerun the SAME
          # phase on the latest saved state. Never force-push or replace cards.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- state/; then
              echo "Newer canonical state; safely replaying this exact phase on its ledger"
              git reset --hard origin/main
              if [ -z "${BLENDER_EXECUTED_DATE:-}" ] || [ -z "${BLENDER_EXECUTED_MODE:-}" ]; then
                echo "Original phase/date missing; preserving saved Core"
                exit 1
              fi
              export MONEYPUCK_EXPORT_ASOF="$BLENDER_EXECUTED_DATE"
              if [ "$BLENDER_EXECUTED_MODE" = "projected" ] || [ "$BLENDER_EXECUTED_MODE" = "confirmed" ]; then
                python run_true_blender.py --date "$BLENDER_EXECUTED_DATE" --mode "$BLENDER_EXECUTED_MODE"
              else
                python -m scripts.run_cycle --date "$BLENDER_EXECUTED_DATE" --mode "$BLENDER_EXECUTED_MODE"
              fi
              git add -- state/
              if git diff --cached --quiet; then
                echo "Canonical state already reflects this phase"
                exit 0
              fi
              git commit -m "Reconcile NHL Blender with freshest authoritative ledger"
            else
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "Published canonical state ($attempt); GitHub Pages is dispatched next"
              exit 0
            fi
            echo "Concurrent update during save; rechecking state ($attempt)"
            sleep 2
          done
          echo "Cannot reconcile without risking locked Core; refusing overwrite"
          exit 1
      # GitHub intentionally suppresses push-triggered workflows for commits
      # made by GITHUB_TOKEN. Explicit workflow_dispatch is the supported way
      # to publish the refreshed verified run/card JSON to GitHub Pages.
      - name: Deploy refreshed Core and gate evidence to existing GitHub Pages
        if: steps.persist.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Publish engine execution diagnostics
        if: always()
        run: |
          echo '## Blender execution status' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verification: ${{ steps.verification.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Engine: ${{ steps.engine.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verification failure never substitutes for a verified Core.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: true-blender-evidence-${{ github.run_id }}
          path: runs/
          if-no-files-found: ignore
