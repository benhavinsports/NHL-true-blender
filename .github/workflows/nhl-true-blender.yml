name: NHL Blender scheduled runs
on:
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * *'
    - cron: '15 21 * * *'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run full slate audit
        run: |
          python - <<'PY'
          import datetime,subprocess,zoneinfo
          now=datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York"))
          mode="projected" if now.hour<14 else "confirmed"
          subprocess.run(["python","run_daily.py","--date",now.date().isoformat(),"--mode",mode],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-run-${{ github.run_id }}
          path: runs/
