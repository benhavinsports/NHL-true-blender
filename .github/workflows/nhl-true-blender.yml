name: NHL True Blender - independent scheduled engine
# Engine dispatch: run the full evidence pipeline after the Pages feed connection.
# Nov 17 live validation: rerun current original G7/G11/Step4/Step9 eliminations
# and G0 nonselected research classification with G18 as final assembly only.
on:
  # A deliberately committed date/phase request uses THIS same serialized
  # authority. Ordinary code pushes still run verification only.
  push:
    branches: [main]
    paths: ['.github/nhl-live-validation.json']
  # Production G0-G18 engine runs on a stable half-hour schedule.
  # Do NOT start a competing live engine on every code push: rapid source
  # changes previously kept the authoritative ledger in never-ending
  # fetch/replay/rebase loops, and queued newer pushes cancelled each other.
  # Code/test pushes still use blender-verification.yml. The scheduled run
  # uses the latest verified main revision and publishes the saved results.
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional slate YYYY-MM-DD; blank uses current Eastern date'
        required: false
        type: string
      mode:
        description: 'Engine phase'
        type: choice
        required: false
        options: [projected, confirmed, watch, grade]
  schedule:
    # Automatic evidence refresh every 30 minutes. The runner reads actual
    # official NHL start times rather than stopping full gate execution at 7 ET.
    # Late starts remain eligible for confirmed research until their own puck drop.
    # After all starts, grade only when the official NHL games are final.
    - cron: '8,38 * * * *'
permissions:
  contents: write
  actions: write # workflow_dispatch for the existing GitHub Pages site
# Never cancel a live evidence/persistence run on every code push.
# Multiple concurrent repairs previously terminated the engine between full
# research and saving the slate, leaving Pages and the Core stale. Serialize
# authority; pending pushes coalesce to GitHub's newest revision. The existing
# persistence step fetches origin/main, verifies newer code, reruns the exact
# phase and reconciles the canonical ledger before any safe push.
concurrency:
  group: nhl-true-blender-authoritative
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore authoritative compressed SQLite ledger
        # On the first run, use the still-tracked raw database and migrate it.
        # Subsequent runs restore the same card/grade history from gzip.
        run: python scripts/ledger_persistence.py restore
      - name: Install original engine and integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r nhl_true_blender_engine/requirements.txt pytest
      - name: Download current MoneyPuck season aggregates
        continue-on-error: true
        run: python scripts/download_moneypuck.py
      - name: Complete legacy and integrated G0-G18 verification
        id: verification
        run: |
          set -euo pipefail
          python -m compileall -q run_true_blender.py nhl_true_blender_engine scripts
          python -m unittest discover -p 'test*.py' -v
          python -m pytest -q nhl_true_blender_engine/tests
      - name: Probe live source schemas without claiming passes
        continue-on-error: true
        run: python -m scripts.diagnose_live_pipeline
      - name: Retract invalid historical Nov 17 G18 ranking before new selection
        if: steps.verification.outcome == 'success'
        run: |
          # Explicit user-authorized, exact-fingerprint one-time retraction.
          # Preserve original cards/versions/gate history in card_retractions.
          # There is NO player substitution or manual Core in this operation.
          python -m scripts.retract_invalid_core
          # Archive the rejected card in SQLite before any candidate can
          # advance. The original fingerprint may never become an automatic
          # default or be silently recycled as a "new" G18 selection.
          # The full subsequent execution uses the current master/overlay
          # evidence rules, including newly repaired G7/G11/G17 source checks.
          # A new original-rules selection may legitimately have identical
          # recipients; its actual first-issued timestamp must be newer than
          # the archived invalid issuance, with a separately saved version.
      - name: Run scheduled autonomous Blender phase
        if: steps.verification.outcome == 'success'
        id: engine
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          REQUESTED_MODE: ${{ inputs.mode }}
          TRIGGER_EVENT: ${{ github.event_name }}
          MONEYPUCK_CSV_DIR: data/moneypuck
        run: |
          python -m scripts.automatic_blender_cycle
      - name: Persist original canonical G18 state and published site JSON
        id: persist
        if: steps.verification.outcome == 'success' && steps.engine.outcome == 'success'
        env:
          MONEYPUCK_CSV_DIR: data/moneypuck
        run: |
          set -euo pipefail
          # Compress + stage the evolving ledger BEFORE asking Git whether
          # state changed. An ignored raw DB can change without git noticing.
          # Never push a >100 MB SQLite blob (GitHub's hard file-size limit).
          python scripts/ledger_persistence.py prepare
          if [ -z "$(git status --porcelain -- state/)" ]; then
            echo "No new state, grade, or verified card JSON"
            exit 0
          fi
          git config user.name "nhl-blender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- state/
          git diff --cached --quiet && exit 0
          git commit -m "Save audited authoritative NHL Blender run output"
          # Engine execution already finished on one tested source revision.
          # Persistence must SAVE its exact output, not restart scouting and
          # re-evaluate the slate just because someone committed code meanwhile.
          # The NEXT scheduled engine cycle will test the newer revision.
          #
          # Use a separate worktree to publish this state-only commit atop
          # the newest main. Keep the runner worktree on the exact engine SHA
          # it executed so final certification uses the same source version.
          # Cherry-pick must never silently replace a concurrently changed
          # ledger; a state conflict remains visible for explicit recovery.
          saved_state_commit="$(git rev-parse HEAD)"
          executed_source_commit="$(git rev-parse HEAD^)"
          echo "Preserving completed Blender execution from $executed_source_commit"
          for attempt in 1 2 3; do
            if ! git fetch origin main; then
              echo "::warning::GitHub fetch unavailable; retrying saved state $attempt/3"
              sleep $((attempt * 5))
              continue
            fi
            persist_dir="$RUNNER_TEMP/blender-persist"
            if [ -d "$persist_dir" ]; then
              git worktree remove --force "$persist_dir"
            fi
            git worktree add --detach "$persist_dir" origin/main
            if ! git -C "$persist_dir" cherry-pick --no-commit "$saved_state_commit"; then
              echo "::error::Concurrent canonical state conflicts with completed Blender execution"
              git worktree remove --force "$persist_dir"
              exit 1
            fi
            if git -C "$persist_dir" diff --cached --quiet; then
              echo "Exact completed state is already present on main"
              git worktree remove --force "$persist_dir"
              exit 0
            fi
            git -C "$persist_dir" commit -m "Save original Blender run from tested source $executed_source_commit"
            if git -C "$persist_dir" push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "Saved exact executed G0-G18 output ($attempt); no rerun inside persistence"
              git worktree remove --force "$persist_dir"
              exit 0
            fi
            echo "::warning::Concurrent remote update while saving; retrying state-only cherry-pick $attempt/3"
            git worktree remove --force "$persist_dir"
            sleep 2
          done
          echo "::error::Completed Blender state could not be saved without conflicting with newer state"
          exit 1
      # GitHub intentionally suppresses push-triggered workflows for commits
      # made by GITHUB_TOKEN. Explicit workflow_dispatch is the supported way
      # to publish the refreshed verified run/card JSON to GitHub Pages.
      - name: Deploy refreshed Core and gate evidence to existing GitHub Pages
        if: steps.verification.outcome == 'success' && steps.persist.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Assert saved Core and execution certification
        id: assert_certification
        if: always()
        env:
          EXECUTED_MODE: ${{ env.BLENDER_EXECUTED_MODE }}
          EXECUTED_DATE: ${{ env.BLENDER_EXECUTED_DATE }}
          VERIFIED_TEST_OUTCOME: ${{ steps.verification.outcome }}
          ENGINE_OUTCOME: ${{ steps.engine.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          GRADE_RETRY_FAILURES: ${{ env.BLENDER_GRADE_RETRY_FAILURES }}
        run: |
          # The collector is allowed to save diagnostics even when it cannot
          # select the original Core. But a GREEN GitHub workflow must mean
          # the scheduled phase actually passed. Never mask source gaps with
          # continue-on-error or an ordinary zero-exit Python runner.
          python - <<'PY'
          import json, os
          from pathlib import Path
          test=os.environ.get('VERIFIED_TEST_OUTCOME')
          engine=os.environ.get('ENGINE_OUTCOME')
          persist=os.environ.get('PERSIST_OUTCOME')
          date=os.environ.get('EXECUTED_DATE')
          mode=os.environ.get('EXECUTED_MODE')
          problems=[]
          if test!='success':
              problems.append('End-to-end verification suite did not pass: '+str(test))
          if engine!='success':
              problems.append('Blender engine step did not complete: '+str(engine))
          if persist=='failure':
              problems.append('Authoritative card/evidence persistence failed')
          if os.environ.get('GRADE_RETRY_FAILURES'):
              grade_problem=('Season grading retries failed (live state retained): '+
                             os.environ['GRADE_RETRY_FAILURES'])
              # A prior-day grade failure cannot invalidate today's original
              # G0-G18 selection. Grade-mode runs still report their own
              # historical catch-up errors as failures.
              if mode=='grade':
                  problems.append(grade_problem)
              else:
                  print('::warning::'+grade_problem)
          if mode in ('projected','confirmed'):
              path=Path('state/site_runs')/f'{date}.json'
              try:
                  status=json.loads(path.read_text(encoding='utf-8'))
              except (OSError,ValueError) as exc:
                  problems.append('Missing/invalid saved source certification: '+str(exc))
              else:
                  # A JSON ledger that was saved is not proof the Blender
                  # selected and certified any Core scorers. This is the
                  # regression that repeatedly presented a green check.
                  if status.get('slateDate')!=date:
                      problems.append('Saved certification has wrong slate date')
                  if not (status.get('selectedCoreFullyCertified') is True or
                          (status.get('currentRunFullyCertified') is True and
                           status.get('survivorOnlyCertification') is True)):
                      problems.append('Original selected Core not certified: '+
                                      str(status.get('errors') or status.get('publicationDecision')))
                  if not status.get('currentRunFullyCertified'):
                      print('::warning::Core is published, but full-slate G0-G17 evidence remains unresolved: '+
                            str(status.get('nonselectedGameResearchNotes') or
                                status.get('errors') or status.get('publicationDecision')))
                  if not status.get('publishedToSite') or not status.get('cardId'):
                      problems.append('No verified authoritative Core published')
                  cardpath=Path('state/site_cards')/f'{date}.json'
                  if not cardpath.is_file():
                      problems.append('Canonical Core file missing: '+str(cardpath))
                  else:
                      card=json.loads(cardpath.read_text(encoding='utf-8'))
                      if card.get('cardId')!=status.get('cardId') or card.get('verified') is not True:
                          problems.append('Published Core does not match certified run ledger')
              # Independent output acceptance: prove the *actual published*
              # Core, not just internally reported certification flags.
              # The full player matrix was checked by the engine; verify the
              # exported two/three survivors have every independently
              # executed, source-backed, ordered pre-puck gate and overlay.
              try:
                  from scripts.verify_published_core import verify_published_core
                  result=verify_published_core(Path('state'),date)
                  print('INDEPENDENT CORE CONTRACT:',json.dumps(result))
                  # A previously withdrawn card can be independently
                  # reissued only by a genuinely later source execution.
                  # Enforce its ledger issuance clock rather than guessing
                  # identity from player names or the unchanged fingerprint.
                  import sqlite3
                  from datetime import datetime
                  con=sqlite3.connect('state/true_blender.sqlite')
                  try:
                      archived=con.execute(
                          "SELECT retracted_at_utc FROM card_retractions "
                          "WHERE slate_date=?",(date,)).fetchone()
                      if archived:
                          issued=con.execute(
                              "SELECT first_issued_at FROM cards "
                              "WHERE slate_date=?",(date,)).fetchone()
                          if (not issued or
                              datetime.fromisoformat(issued[0].replace('Z','+00:00')) <=
                              datetime.fromisoformat(archived[0].replace('Z','+00:00'))):
                              problems.append('Revoked Core reappeared without a later independent G18 issuance')
                  except sqlite3.OperationalError as exc:
                      if 'no such table: card_retractions' not in str(exc):
                          raise
                  finally:
                      con.close()
              except Exception as exc:
                  problems.append('Full 36-gate published Core verification failed: '+str(exc))
          print('Scheduled Blender phase:',date,mode)
          print('Verification:',test,'engine:',engine,'persist:',persist)
          if problems:
              for problem in problems:
                  print('::error::'+problem)
              raise SystemExit('BLENDER EXECUTION FAILED CERTIFICATION; evidence was preserved')
          if mode in ('projected','confirmed'):
              print('BLENDER CORE VERIFIED: original selected Core, phase and canonical evidence match.')
              print('Full slate completeness is reported separately; a valid Core is not a 12/12 survivor guarantee.')
          elif mode == 'grade':
              print('BLENDER GRADE PHASE VERIFIED: run completed; NO scorer Core issuance or selection certification was asserted.')
              print('A grade-mode success is not proof any historical replay slate or new Core was certified.')
          else:
              print('BLENDER WATCH PHASE VERIFIED: monitoring completed; NO new Core issuance was asserted.')
          PY
      - name: Publish engine execution diagnostics
        if: always()
        run: |
          echo '## Blender execution status' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verification: ${{ steps.verification.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Engine: ${{ steps.engine.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Certification assertion: ${{ steps.assert_certification.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'A passing workflow MUST have a certified, saved Core when projected/confirmed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: true-blender-evidence-${{ github.run_id }}
          path: |
            runs/
            state/site_runs/
            state/site_cards/
          if-no-files-found: warn

