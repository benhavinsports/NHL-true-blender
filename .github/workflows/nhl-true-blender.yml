name: NHL Blender — scheduled evidence runs
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: "Optional slate date (YYYY-MM-DD); default is today in New York"
        required: false
        type: string
      mode:
        description: "Projected or confirmed pass"
        required: false
        type: choice
        options:
          - projected
          - confirmed
  schedule:
    - cron: '15 13 * * *'
    - cron: '15 21 * * *'
permissions:
  contents: write
concurrency:
  group: nhl-blender-slate
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r nhl_true_blender_engine/requirements.txt
      - name: Download current MoneyPuck season aggregates
        run: |
          python scripts/download_moneypuck.py
      - name: Run both legacy and integrated engine regression suites
        run: |
          python -m unittest discover -p 'test*.py' -v
          python -m pytest -q nhl_true_blender_engine/tests
      - name: Run official NHL full-slate evidence audit
        env:
          MONEYPUCK_CSV_DIR: data/moneypuck
          MONEYPUCK_EXPORT_ASOF: ${{ env.MONEYPUCK_EXPORT_ASOF }}
          REQUESTED_DATE: ${{ inputs.date }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import datetime, os, subprocess, zoneinfo
          now = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York"))
          date = os.getenv("REQUESTED_DATE") or now.date().isoformat()
          mode = os.getenv("REQUESTED_MODE") or ("projected" if now.hour < 14 else "confirmed")
          datetime.date.fromisoformat(date)
          assert mode in ("projected", "confirmed")
          subprocess.run(["python", "run_true_blender.py", "--date", date, "--mode", mode], check=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Integrated G0-G18 selection execution: {date} / {mode}. Check run artifact for verified card status.\
")
          PY
      - name: Grade previous slate against official NHL boxscores
        if: always()
        run: python postgame_grade.py
      - name: Audit every officially graded missed leg
        if: always()
        run: python postgame_audit.py
      - name: Persist authoritative Core across runs
        run: |
          if [ -z "$(git status --porcelain -- state/)" ]; then
            echo "No new verified Core state to persist"
            exit 0
          fi
          git config user.name "nhl-blender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/
          git diff --cached --quiet && exit 0
          git commit -m "Persist verified NHL Blender authoritative Core"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-evidence-${{ github.run_id }}
          path: runs/
          if-no-files-found: warn
