name: Rename pre-Core survivor field
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rename-pre-core-survivors.yml']
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rename the survivor field without changing selection logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          old = 'allG18QualifiedSurvivors'
          new = 'preCoreQualifiedSurvivors'
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          changed = []
          for name in paths:
              p = Path(name)
              if not name or p.is_symlink() or not p.is_file():
                  continue
              if p.parts[0] in ('state', '.github'):
                  continue
              if p.suffix not in ('.py', '.js', '.ts', '.tsx', '.jsx', '.html', '.json'):
                  continue
              raw = p.read_bytes()
              updated = raw.replace(old.encode(), new.encode())
              if updated != raw:
                  p.write_bytes(updated)
                  changed.append(name)
          if not changed:
              raise SystemExit('No matching source references found; no rename committed')
          print('Renamed references in:', ', '.join(changed))
          PY
      - name: Install verification dependencies
        run: pip install -r requirements.txt -r nhl_true_blender_engine/requirements.txt pytest
      - name: Verify renamed source and engine regressions
        run: |
          python -m compileall -q nhl_true_blender_engine run_true_blender.py
          node --check site/app.js
          python -m pytest -q nhl_true_blender_engine/tests
          git diff --check
      - name: Commit only the verified rename
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --stat
          git commit -m 'Rename pre-Core survivor field to avoid implying G18 qualification'
          git push origin HEAD:main
