name: Historical replay regression
on:
  push:
    branches: [audit/historical-season-replay]
permissions:
  contents: read
jobs:
  historical-issuance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r nhl_true_blender_engine/requirements.txt pytest
      - run: python -m pytest -q nhl_true_blender_engine/tests/test_historical_card_issuance.py
