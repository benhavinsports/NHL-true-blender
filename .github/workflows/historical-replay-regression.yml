name: Historical replay regression
on:
  push:
    branches:
      - audit/historical-season-replay
  workflow_dispatch:
    inputs:
      start_date:
        description: "First NHL slate date (YYYY-MM-DD)"
        required: true
        default: "2026-09-29"
        type: string
      end_date:
        description: "Last NHL slate date (YYYY-MM-DD)"
        required: true
        default: "2026-11-17"
        type: string
permissions:
  contents: read
concurrency:
  group: historical-replay-regression-${{ github.ref }}
  cancel-in-progress: false
jobs:
  historical-issuance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install replay dependencies
        run: python -m pip install -r requirements.txt -r nhl_true_blender_engine/requirements.txt pytest
      - name: Restore canonical archive into isolated Actions workspace
        run: python scripts/ledger_persistence.py restore
      - name: Inventory source archive without modifying it
        run: |
          mkdir -p state/replay
          python scripts/inspect_historical_archive.py > state/replay/source-inventory.json
      - name: Fetch official NHL schedule from ${{ inputs.start_date || '2026-09-29' }} through ${{ inputs.end_date || '2026-11-17' }}
        env:
          PYTHONPATH: .
        run: python scripts/fetch_official_slate_calendar.py --start ${{ inputs.start_date || '2026-09-29' }} --end ${{ inputs.end_date || '2026-11-17' }} --output state/replay/official_schedule.json
      - name: Create preliminary official-schedule manifest for historical collectors
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("state/replay/official_schedule.json").read_text())
          days=sorted(x["date"] for x in c.get("calendarDays",[]) if x.get("games"))
          Path("state/replay/collector-manifest.json").write_text(json.dumps({
              "start":c["start"],"end":c["end"],"scheduledDates":days,
              "officialSchedule":{x["date"]:x for x in c["calendarDays"]}
          },indent=2))
          PY
      - name: Inventory dated Daily Faceoff goalie reports for every scheduled date
        id: dfo_archive
        continue-on-error: true
        run: python scripts/inventory_dfo_historical_goalies.py state/replay/collector-manifest.json state/replay/dfo-goalie-archive.json
      - name: Ingest validated historical goalie evidence into canonical Blender ledger
        id: dfo_ingestion
        if: steps.dfo_archive.outcome == 'success'
        env:
          PYTHONPATH: .
        run: python scripts/ingest_dfo_goalie_evidence.py state/replay/collector-manifest.json state/replay/dfo-goalie-archive.json
      - name: Verify DFO historical goalie evidence reached the canonical ledger
        if: steps.dfo_ingestion.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("state/replay/dfo-goalie-ingestion.json").read_text())
          imported=report.get("importedReceiptCount",0)
          if imported < 1:
              raise SystemExit("DFO archive was discovered but zero goalie-starter receipts reached the canonical evidence ledger")
          print(json.dumps({
              "importedReceiptCount":imported,
              "newReceiptCount":report.get("newReceiptCount",0),
              "rejectedCount":report.get("rejectedCount",0),
              "selectorIntegration":report.get("selectorIntegration")
          },sort_keys=True))
          PY
      - name: Build point-in-time bundles and official schedule calendar from ${{ inputs.start_date || '2026-09-29' }} through ${{ inputs.end_date || '2026-11-17' }}
        id: build_bundles
        env:
          PYTHONPATH: .
        run: python scripts/build_replay_bundles.py --start ${{ inputs.start_date || '2026-09-29' }} --end ${{ inputs.end_date || '2026-11-17' }} --output state/replay
      - name: Prepare pre-G0 baseline engine package without changing this branch
        run: |
          mkdir -p /tmp/blender-baseline/nhl_true_blender_engine /tmp/blender-baseline/scripts
          cp -a nhl_true_blender_engine/. /tmp/blender-baseline/nhl_true_blender_engine/
          git show dd3bf67:nhl_true_blender_engine/engine.py > /tmp/blender-baseline/nhl_true_blender_engine/engine.py
          cp scripts/replay_historical_season.py /tmp/blender-baseline/scripts/
          cp scripts/replay_postgame_grade.py /tmp/blender-baseline/scripts/
      - name: Probe 5V5 Hockey dated pregame forward-line archive
        id: historical_lines
        continue-on-error: true
        run: python scripts/probe_5v5_historical_lines.py state/replay/5v5-historical-lines-probe.json
      - name: Create opening-week manifest from the same frozen official calendar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path("state/replay/manifest.json")
          manifest=json.loads(source.read_text())
          start,end="${{ inputs.start_date || '2026-09-29' }}","2026-10-05"
          subset={**manifest,"start":start,"end":end}
          subset["officialSchedule"]={k:v for k,v in manifest["officialSchedule"].items() if start<=k<=end}
          subset["slates"]={k:v for k,v in manifest["slates"].items() if start<=k<=end}
          subset["verifiedOffDays"]=[x for x in manifest.get("verifiedOffDays",[]) if start<=x<=end]
          subset["scheduledDates"]=[x for x in manifest.get("scheduledDates",[]) if start<=x<=end]
          Path("state/replay/opening-week-manifest.json").write_text(json.dumps(subset,indent=2))
          PY
      - name: Replay opening seven calendar days and grade frozen selections
        id: opening_week
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          python scripts/replay_historical_season.py state/replay/opening-week-manifest.json state/replay/opening-week-selections.jsonl --grades state/replay/opening-week-grades.jsonl
      - name: Replay full ${{ inputs.start_date || '2026-09-29' }} through ${{ inputs.end_date || '2026-11-17' }} period and grade frozen selections
        id: full_period
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          python scripts/replay_historical_season.py state/replay/manifest.json state/replay/selections.jsonl --grades state/replay/grades.jsonl
      - name: Replay baseline engine on the identical full-period bundles
        id: baseline_period
        continue-on-error: true
        env:
          PYTHONPATH: /tmp/blender-baseline:.
        run: |
          mkdir -p state/replay/baseline
          python /tmp/blender-baseline/scripts/replay_historical_season.py state/replay/manifest.json state/replay/baseline/selections.jsonl --grades state/replay/baseline/grades.jsonl
      - name: Audit all official scorers, G10.5 challengers, G0 sides and shot routes
        id: postgame_research
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          python scripts/replay_postgame_research.py state/replay/manifest.json state/replay/selections.jsonl state/replay/postgame-research.jsonl
      - name: Compare baseline and patched frozen selections
        if: steps.build_bundles.outcome == 'success' && steps.opening_week.outcome == 'success' && steps.full_period.outcome == 'success' && steps.baseline_period.outcome == 'success'
        run: |
          python scripts/compare_historical_replays.py state/replay/baseline/selections.jsonl state/replay/baseline/grades.jsonl state/replay/selections.jsonl state/replay/grades.jsonl state/replay/baseline-vs-patched.json
      - name: Build per-slate and aggregate G0-G18 audit report
        if: steps.build_bundles.outcome == 'success' && steps.full_period.outcome == 'success' && steps.postgame_research.outcome == 'success'
        run: |
          python scripts/summarize_historical_replay.py state/replay/manifest.json state/replay/selections.jsonl state/replay/grades.jsonl state/replay/postgame-research.jsonl state/replay/baseline-vs-patched.json state/replay/audit-report.json --dfo state/replay/dfo-goalie-archive.json
      - name: Summarize actual replay and grade ledgers
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("state/replay")
          for name in ("opening-week-selections.jsonl","opening-week-grades.jsonl","selections.jsonl","grades.jsonl","baseline/selections.jsonl","baseline/grades.jsonl","postgame-research.jsonl","baseline-vs-patched.json","audit-report.json","audit-report.md","dfo-goalie-archive.json","5v5-historical-lines-probe.json"):
              path=root/name
              print(f"## {name}")
              if not path.exists():
                  print("NOT_CREATED")
                  continue
              if name.endswith(".json"):
                  print(json.dumps(json.loads(path.read_text()),sort_keys=True))
                  continue
              if name.endswith(".md"):
                  print(path.read_text())
                  continue
              for line in path.read_text().splitlines():
                  row=json.loads(line)
                  if "selections" in name:
                      result=row.get("engineResult") or {}
                      card=result.get("card")
                      print(json.dumps({
                          "date":row.get("date"),"status":row.get("status"),
                          "cutoff":row.get("cutoff"),"stage":row.get("stage"),
                          "games":result.get("games"),
                          "eligibleSkaterRows":result.get("eligibleSkaterRows"),
                          "gateRows":result.get("gateRows"),
                          "survivors":result.get("uniqueGameSurvivors"),
                          "core":[{"player":x.get("player"),"game":x.get("matchup")}
                                  for x in (card or {}).get("current_legs",[])],
                          "certified":(row.get("gateCertification") or {}).get("selectedCoreOnlyFullyCertified"),
                          "errors":result.get("errors",[]),
                          "reason":row.get("reason")
                      },sort_keys=True))
                  else:
                      print(json.dumps(row,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-replay-${{ inputs.start_date || '2026-09-29' }}-through-${{ inputs.end_date || '2026-11-17' }}
          path: state/replay/
          if-no-files-found: error
      - name: Run full engine regression suite
        if: always()
        run: python -m pytest -q nhl_true_blender_engine/tests
      - name: Fail CI if any scheduled slate remains incomplete
        if: always()
        run: |
          if [ "${{ steps.opening_week.outcome }}" != "success" ] || [ "${{ steps.full_period.outcome }}" != "success" ]; then
            echo "Historical replay is incomplete. See uploaded ledgers for every blocked date."
            exit 1
          fi
