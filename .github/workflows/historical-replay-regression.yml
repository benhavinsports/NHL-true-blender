name: Historical replay regression
on:
  push:
    branches: [audit/historical-season-replay]
permissions:
  contents: read
jobs:
  historical-issuance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore canonical SQLite archive
        run: python scripts/ledger_persistence.py restore
      - name: Inventory actual historical replay source coverage
        run: python scripts/inspect_historical_archive.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r nhl_true_blender_engine/requirements.txt pytest
      - name: Build immutable pregame bundles from archived evidence (Nov 15–17 only)
        env:
          PYTHONPATH: .
        run: python scripts/build_replay_bundles.py --start 2026-11-15 --end 2026-11-17 --output state/replay
      - name: Replay original Blender gates against the saved historical inputs
        env:
          PYTHONPATH: .
        run: python scripts/replay_historical_season.py state/replay/manifest.json state/replay/selections.jsonl --grades state/replay/grades.jsonl
      - name: Summarize historical replay and official grades
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (Path("state/replay/selections.jsonl"), Path("state/replay/grades.jsonl")):
              print(f"## {path.name}")
              if not path.exists():
                  print("NOT_CREATED")
                  continue
              for line in path.read_text().splitlines():
                  row=json.loads(line)
                  if path.name=="selections.jsonl":
                      result=row.get("engineResult") or {}
                      card=result.get("card")
                      print(json.dumps({
                          "date":row.get("date"),"status":row.get("status"),
                          "stage":row.get("stage"),
                          "games":result.get("games"),
                          "eligibleSkaterRows":result.get("eligibleSkaterRows"),
                          "gateRows":result.get("gateRows"),
                          "survivors":result.get("uniqueGameSurvivors"),
                          "core":[{"player":x.get("player"),"game":x.get("matchup")}
                                  for x in (card or {}).get("current_legs",[])],
                          "certified":(row.get("gateCertification") or {}).get("selectedCoreOnlyFullyCertified"),
                          "errors":result.get("errors",[])
                      },sort_keys=True))
                  else:
                      print(json.dumps(row,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: historical-replay-nov15-to-17
          path: state/replay/
          if-no-files-found: error
      - name: Run full engine regression suite, including the G0 attack-direction repair
        run: python -m pytest -q nhl_true_blender_engine/tests
